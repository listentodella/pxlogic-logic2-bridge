[workspace]
members = [
  "crates/pxlogic-core",
  "crates/pxlogic-file",
  "crates/pxlogic-waveform",
  "crates/pxlogic-graph",
  "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
parking_lot = "0.12"
rayon = "1"
rusb = { version = "0.9", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev.package.pxlogic-core]
opt-level = 3

[profile.dev.package.pxlogic-graph]
opt-level = 3

[profile.dev.package.pxlogic-waveform]
opt-level = 3
