[package]
name = "pxlogic-logic2-bridge-client"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
build = "build.rs"

[workspace]

[dependencies]
libc = "0.2"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
